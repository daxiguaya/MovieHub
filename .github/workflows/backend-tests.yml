name: Backend tests

on:
  push:
    branches:
      - main
      - "phase4/**"
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
        working-directory: backend
      - name: Compile backend
        run: python -m compileall -q app scripts tests
        working-directory: backend
      - name: Run tests
        run: python -m pytest -q
        working-directory: backend

      - name: Validate Compose configuration
        run: docker compose config --quiet
        env:
          MOVIEHUB_IMPORT_PATH: /tmp/scout-import
          MOVIEHUB_API_KEY: ci-placeholder-only
          MOVIEHUB_FRONTEND_CONFIG_PATH: ./deploy/frontend-config.json
      - name: Build backend container image
        run: docker build --tag moviehub-backend:ci ./backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
        working-directory: frontend
      - name: Run frontend regression tests
        run: npm test -- --reporter=dot
        working-directory: frontend
      - name: Type-check and build frontend
        run: npm run build
        working-directory: frontend
      - name: Build frontend container image
        run: docker build --tag moviehub-frontend:ci ./frontend


  frontend-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
        working-directory: frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run browser end-to-end tests
        run: npm run test:e2e
        working-directory: frontend
