name: TMDB overview coverage audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "GitHub Actions run ID containing the verified first-launch JSON artifact"
        required: true
        type: string
        default: "45329522019"

permissions:
  actions: read
  contents: read

# Opt-in push marker: [run-tmdb-audit] (source artifact defaults to the verified first-launch run)
concurrency:
  group: tmdb-overview-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-tmdb-audit]')) || (github.event_name == 'pull_request' && github.head_ref == 'fix/annual-tmdb-localized-directors')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout MovieHub
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Download verified first-launch source artifact
        uses: actions/download-artifact@v4
        with:
          name: moviehub-first-launch-douban
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || '45329522019' }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/moviehub-first-launch-bundle

      - name: Verify API token is configured
        env:
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
        run: |
          if [ -z "$TMDB_API_READ_TOKEN" ]; then
            echo "::error::Add the repository Actions secret TMDB_API_READ_TOKEN before running this audit."
            exit 1
          fi

      - name: Run read-only audit for Top 250 and all four annual charts
        working-directory: backend
        env:
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
        run: |
          set -euo pipefail
          input_dir="${RUNNER_TEMP}/moviehub-first-launch-bundle"
          python -m scripts.audit_tmdb_overview \
            --input-dir "$input_dir" \
            --date 2026-11-24 \
            --language zh-CN \
            --language zh-TW \
            --min-interval 0.3 \
            > "${RUNNER_TEMP}/tmdb-overview-audit-top250.json"
          python -m scripts.audit_tmdb_overview \
            --input-dir "$input_dir" \
            --date 2026-11-23 \
            --language zh-CN \
            --language zh-TW \
            --min-interval 0.3 \
            > "${RUNNER_TEMP}/tmdb-overview-audit-annual-2025.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          for name in ("tmdb-overview-audit-top250.json", "tmdb-overview-audit-annual-2025.json"):
              report = json.loads((root / name).read_text(encoding="utf-8"))
              print(json.dumps({
                  "report": name,
                  "movie_count": report["movie_count"],
                  "language_count": report["language_count"],
                  "record_count": report["record_count"],
                  "summary": report["summary"],
                  "by_language": report["by_language"],
              }, ensure_ascii=False))
          PY

      - name: Upload coverage reports (no synopsis text)
        uses: actions/upload-artifact@v4
        with:
          name: moviehub-tmdb-overview-audit
          path: |
            ${{ runner.temp }}/tmdb-overview-audit-top250.json
            ${{ runner.temp }}/tmdb-overview-audit-annual-2025.json
          if-no-files-found: error
          retention-days: 14
