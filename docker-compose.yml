services:
  moviehub:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: moviehub-backend:local
    container_name: moviehub-backend
    restart: unless-stopped
    init: true
    read_only: true
    user: "${MOVIEHUB_UID:-10001}:${MOVIEHUB_GID:-10001}"
    environment:
      MOVIEHUB_DATA_DIR: /data
      MOVIEHUB_IMPORT_DIR: /imports
      MOVIEHUB_API_KEY: ${MOVIEHUB_API_KEY:-}
      MOVIEHUB_CORS_ORIGINS: ${MOVIEHUB_CORS_ORIGINS:-[]}
      MOVIEHUB_LOG_LEVEL: ${MOVIEHUB_LOG_LEVEL:-INFO}
    volumes:
      - ${MOVIEHUB_DATA_PATH:-/volume1/docker/moviehub/data}:/data
      - ${MOVIEHUB_IMPORT_PATH:?Set MOVIEHUB_IMPORT_PATH to the directory containing the Scout database}:/imports:ro
    expose:
      - "8000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
      - npm_proxy

networks:
  default:
    driver: bridge
  npm_proxy:
    external: true
    name: chatgpt-browser_default
