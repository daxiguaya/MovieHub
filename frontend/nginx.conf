worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    keepalive_timeout 30;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://image.tmdb.org https://www.themoviedb.org; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        root /usr/share/nginx/html;
        index index.html;

        location = /moviehub {
            return 308 /moviehub/;
        }

        location ^~ /moviehub/api/ {
            rewrite ^/moviehub(/api/.*)$ $1 break;
            proxy_pass http://moviehub:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /moviehub/config.json {
            alias /usr/share/nginx/html/config.json;
            add_header Cache-Control "no-store";
        }

        location ^~ /moviehub/ {
            rewrite ^/moviehub/(.*)$ /$1 break;
            try_files $uri $uri/ /index.html;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /config.json {
            add_header Cache-Control "no-store";
            try_files $uri =404;
        }
    }
}
